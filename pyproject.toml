[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yeelight-cli"
version = "0.1.0"
description = "A dynamic, feature-rich CLI wrapper around the python-yeelight package"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yeelight>=0.7.0"
]

[project.scripts]
yeelight = "yeelight_cli:main"
